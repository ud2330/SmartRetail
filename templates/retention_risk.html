<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Segmentation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #dff2fb;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #1d3557;
      color: #fff;
      padding: 20px;
      position: fixed;
      height: 100vh;
      left: -240px;
      top: 0;
      transition: left 0.3s ease;
      z-index: 1000;
    }

    body.sidebar-open .sidebar {
      left: 0;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .sidebar ul {
      list-style: none;
      padding-left: 0;
    }

    .sidebar ul li {
      margin: 15px 0;
    }

    .sidebar ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .sidebar ul li a.active {
      font-weight: bold;
      color: #4facfe;
    }

    /* Toggle Button */
    .sidebar-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #1d3557;
      border: none;
      padding: 10px;
      border-radius: 10px;
      z-index: 1100;
      cursor: pointer;
    }

    .sidebar-toggle .line {
      width: 25px;
      height: 3px;
      background-color: #fff;
      margin: 4px 0;
    }

    /* Main Content */
    .main-content {
      margin: 60px auto;
      padding: 40px;
      max-width: 700px;
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      transition: margin-left 0.3s ease;
      width: 100%;
    }

    body.sidebar-open .main-content {
      margin-left: 260px;
    }

    h1 {
      text-align: center;
      font-weight: 700;
      color: #1d3557;
    }

    .subtext {
      text-align: center;
      margin-bottom: 30px;
      color: #555;
    }

    label {
      margin-top: 15px;
      font-weight: 600;
      color: #1d3557;
    }

    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #bcdff7;
      background: #f8fbff;
    }

    button[type="submit"] {
      margin-top: 25px;
      background: linear-gradient(135deg, #4facfe, #a0dbff);
      color: #1d3557;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 10px;
      width: 100%;
    }

    .result-box {
      margin-top: 30px;
      padding: 20px;
      background: #eaf4ff;
      border-radius: 10px;
      display: none;
    }

    .prediction-text {
      font-weight: bold;
      color: #1d3557;
    }
  </style>
</head>
<body>

<!-- Sidebar toggle button -->
<button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
  <span class="line"></span>
  <span class="line"></span>
  <span class="line"></span>
</button>

<!-- Sidebar -->
<div class="sidebar">
  <h2>SmartRetail</h2>
  <ul>
    <li><a href="{{ url_for('home') }}">Home</a></li>
    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li><a href="{{ url_for('stockout_form_page') }}">Stock-Out Predictor</a></li>
    <li><a href="{{ url_for('sales') }}">Sales Forecast</a></li>
    <li><a href="{{ url_for('segmentation') }}">Customer Segmentation</a></li>
    <li><a href="{{ url_for('recommendation') }}">Offer Recommendation</a></li>
    <li><a href="{{ url_for('trend') }}">Trend Forecasting</a></li>
    <li><a href="{{ url_for('category_optimization') }}">Category Optimization</a></li>
    <li><a href="{{ url_for('retention_risk') }}">Retention Risk</a></li>
    <li><a href="{{ url_for('upload') }}">Upload your data</a></li>
  </ul>
</div>

<!-- Main Content -->
<div class="main-content">
  <h1>Customer Segmentation</h1>
  <p class="subtext">Provide customer details to predict segmentation</p>

  <form id="segmentForm">
    <label for="loyalty_score">Loyalty Score (1–5)</label>
    <select id="loyalty_score" name="loyalty_score" required>
      <option value="" disabled selected>--Select--</option>
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>

    <label for="eco_friendly">Do you consider eco-friendliness when choosing a product?</label>
    <select id="eco_friendly" name="eco_friendly" required>
      <option value="" disabled selected>--Select--</option>
      <option>Yes</option><option>No</option><option>Sometimes</option>
    </select>

    <label for="stock_frequency">How frequently do you find your preferred items out of stock?</label>
    <select id="stock_frequency" name="stock_frequency" required>
      <option value="" disabled selected>--Select--</option>
      <option>Always</option><option>Often</option><option>Sometimes</option><option>Rarely</option><option>Never</option>
    </select>

    <label for="online_switch">How likely are you to switch to online shopping in the next 12 months? (%)</label>
    <input type="number" id="online_switch" name="online_switch" min="0" max="100" required>

    <label for="satisfaction">How satisfied are you with your overall shopping experience? (1–5)</label>
    <select id="satisfaction" name="satisfaction" required>
      <option value="" disabled selected>--Select--</option>
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>

    <label for="store_switch">Would you switch to another store if offers are better or items are unavailable?</label>
    <select id="store_switch" name="store_switch" required>
      <option value="" disabled selected>--Select--</option>
      <option>Yes</option><option>No</option><option>Depends</option>
    </select>

    <button type="submit">Predict Segment</button>
  </form>

  <div id="result" class="result-box"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const sidebarToggle = document.getElementById('sidebarToggle');
  const body = document.body;
  const mainContent = document.querySelector('.main-content');

  sidebarToggle.addEventListener('click', function () {
    body.classList.toggle('sidebar-open');
  });

  mainContent.addEventListener('click', function (event) {
    if (body.classList.contains('sidebar-open') &&
        !event.target.closest('.sidebar') &&
        !event.target.closest('.sidebar-toggle')) {
      body.classList.remove('sidebar-open');
    }
  });

  document.getElementById('segmentForm').onsubmit = async function (e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = {};
    for (let [key, value] of formData.entries()) {
      data[key] = value;
    }

    const resultBox = document.getElementById('result');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `<span style='color:#2d8be7;'>Predicting...</span>`;

    try {
      const response = await fetch('/predict-segment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      if (response.ok) {
        resultBox.innerHTML = `<p class="prediction-text">Predicted Segment: ${result.segment}</p>`;
      } else {
        resultBox.innerHTML = `<span style="color:#c0392b;">Error: ${result.error || 'Unknown error'}</span>`;
      }
    } catch (err) {
      resultBox.innerHTML = `<span style="color:#c0392b;">Server error: ${err.message}</span>`;
    }
  };
});
</script>
</body>
</html>
